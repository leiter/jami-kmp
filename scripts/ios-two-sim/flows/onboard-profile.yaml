# Profile screen → account summary → conversation list. Split out so a run that stopped
# here can be resumed.
appId: net.jami.iosapp
---
- extendedWaitUntil:
    visible: "Add a profile photo"
    timeout: 60000
- tapOn:
    point: "50%,38%"
- inputText: "${NAME}"
# The app's Continue button, by position. On a freshly erased simulator with a second keyboard
# language, iOS shows a one-time keyboard tip ("Type English (US) and German … Continue") over
# the lower half. Its "Continue" is also below the profile photo and took a text-matched tap,
# and the tip is drawn by the keyboard process, so Maestro cannot see it to dismiss it
# (2026-11-24). The button sits at 47% height, above both the keyboard and the tip.
- tapOn:
    point: "50%,47%"
# On a fresh install the notification prompt covers the summary (covered elements are not
# "visible"), followed by the contacts prompt. The system UI keeps the simulator's original
# language, so both spellings are matched.
- extendedWaitUntil:
    visible: "Allow|Erlauben|Continue to Jami"
    timeout: 60000
- tapOn:
    text: "Allow|Erlauben"
    optional: true
# The contacts prompt can take well over 10 s under the memory pressure of two simulators
# (2026-11-18 it came after the wait had given up and covered "Continue to Jami").
- extendedWaitUntil:
    visible: "Don.t Allow|Nicht erlauben"
    timeout: 30000
    optional: true
- tapOn:
    text: "Don.t Allow|Nicht erlauben"
    optional: true
- extendedWaitUntil:
    visible: "Continue to Jami"
    timeout: 30000
- tapOn: "Continue to Jami"
- extendedWaitUntil:
    visible: "Search conversations"
    timeout: 30000
