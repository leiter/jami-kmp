# In an open chat: ${TEXT} disappears (a deletion or edit propagated).
appId: net.jami.iosapp
---
# Another tool on this Mac may have brought its own app forward; this does not restart Jami.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    notVisible: "${TEXT}(\\n[\\s\\S]*)?"
    timeout: 60000
